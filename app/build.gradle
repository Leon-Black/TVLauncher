plugins {
    id 'com.android.application'
}

android {
    namespace 'me.leon.tvlauncher'
    compileSdk 35

    defaultConfig {
        applicationId 'me.leon.tvlauncher'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'me.leon.tvlauncher.LauncherSmokeInstrumentation'
        resValue 'string', 'app_name', 'TV Launcher'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            resValue 'string', 'app_name', 'TV Launcher 测试版'
        }
        release {
            debuggable false
        }
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('TVLAUNCHER_KEYSTORE')
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv('TVLAUNCHER_STORE_PASSWORD')
                keyAlias System.getenv('TVLAUNCHER_KEY_ALIAS') ?: 'tvlauncher-release'
                keyPassword System.getenv('TVLAUNCHER_KEY_PASSWORD')
            }
        }
        debug {
            storeFile rootProject.file('.tools/debug.keystore')
        }
    }

    buildTypes.release.signingConfig = signingConfigs.release
}
